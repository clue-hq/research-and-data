[project]
name = "clue-design"
version = "0.0.0"
description = "Design substrate (design-integration Part II, slice D0) — the design subsystem's platform-native persistence: design_* schema DAL over Postgres, tenancy-scoped from birth."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "clue-core",
    "clue-db",
    "clue-config",
    "clue-obs",
    "clue-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_design"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-db = { workspace = true }
clue-config = { workspace = true }
clue-obs = { workspace = true }
clue-storage = { workspace = true }
