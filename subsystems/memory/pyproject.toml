[project]
name = "clue-memory"
version = "0.0.0"
description = "Doc M scoped-memory substrate (subsystem two) — behind its two seams (PB-B3 slice 1)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "clue-core",
    "clue-db",
    "clue-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_memory"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-db = { workspace = true }
clue-config = { workspace = true }
