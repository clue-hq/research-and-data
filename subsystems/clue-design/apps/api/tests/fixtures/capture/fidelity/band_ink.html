<!doctype html>
<html><head><meta charset="utf-8"><title>S6 probe: the text measured on a band</title>
<!-- S6 probe. Two ordinary B2B layouts: a light band that opens with an accent-coloured eyebrow line
     above its heading and body, and a dark band whose first words sit in a white quote card. The page's
     own body text on each band is readable. Local file only. -->
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #111; }
  main > section { padding: 80px 40px; min-height: 240px; }
  .hero { background: #ffffff; }
  .why { background: #f3f0e8; }
  .why .eyebrow { color: #f5a623; font: 700 12px/1.4 Arial; letter-spacing: .1em; text-transform: uppercase; }
  .why h2 { color: #1a1a1a; }
  .why p.body { color: #333333; }
  .quotes { background: #0b2545; color: #ffffff; }
  .quotes .card { background: #ffffff; color: #222222; padding: 24px; border-radius: 12px; max-width: 420px; }
  .quotes h3 { color: #ffffff; }
  .b { display: inline-flex; padding: 12px 24px; border: 0; border-radius: 8px; background: #047464; color: #fff; }
</style></head>
<body>
<main>
  <section class="hero"><h1>Hero</h1><button class="b">Book a demo</button></section>
  <section class="why">
    <p class="eyebrow">Why teams switch</p>
    <h2>A heading in near-black</h2>
    <p class="body">Body copy in dark grey, readable on the cream band.</p>
  </section>
  <section class="quotes">
    <div class="card"><p>"A quote in a white card."</p></div>
    <h3>What our customers say, in white on navy</h3>
  </section>
</main>
</body></html>
