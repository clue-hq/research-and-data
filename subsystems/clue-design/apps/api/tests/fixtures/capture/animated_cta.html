<!doctype html>
<html><head><meta charset="utf-8"><title>Animated CTA fixture</title>
<!-- Wave 2 A9 FX-C2: a pulsing call to action (a CSS animation on box-shadow and transform, the
     common "attention" CTA) whose hover changes only its fill. Its rest look is its authored static
     look, and each state is read against it, so no animation frame becomes a state. Beside it, a CTA
     that fades in on load from an authored `opacity: 0` (its finished entrance holds the look the
     page shows). Opened from file://; never a real site. -->
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #111; }
  header { display: flex; gap: 24px; padding: 16px 40px; }
  header a { color: #0d2b25; text-decoration: none; }
  .wrap { padding: 40px; display: flex; gap: 24px; align-items: center; }
  .cta { display: inline-flex; padding: 12px 24px; border-radius: 8px; background: #047464; color: #fff;
         border: 0; font: 500 14px/1.4 Arial; cursor: pointer; animation: pulse 1.2s ease-in-out infinite; }
  .cta:hover { background: #035a4e; }
  .fade { display: inline-flex; padding: 12px 24px; border-radius: 8px; background: #28241e; color: #fff;
          border: 0; font: 500 14px/1.4 Arial; cursor: pointer; opacity: 0; transform: translateY(16px);
          animation: fade-up .4s ease-out .1s forwards; }
  .fade:hover { background: #000; }
  @keyframes fade-up { to { opacity: 1; transform: none; } }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(4, 116, 100, .6); transform: scale(1); }
    100% { box-shadow: 0 0 0 14px rgba(4, 116, 100, 0); transform: scale(1.04); }
  }
  section.band { padding: 60px 40px; background: #014036; color: #fff; }
</style></head>
<body>
<header><nav><a id="n-home" href="#home">Home</a></nav></header>
<main>
  <div class="wrap">
    <button class="cta" id="b-pulse">Book now</button>
    <button class="fade" id="b-fade">See the plans</button>
  </div>
</main>
<section class="band"><h2>The statement band</h2><p>Light text on a dark band.</p></section>
</body></html>
