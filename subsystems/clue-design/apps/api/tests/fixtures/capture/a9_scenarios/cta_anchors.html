<!doctype html>
<html><head><meta charset="utf-8"><title>CTA anchors fixture</title>
<!-- A9 scenario A5c: call-to-action anchors whose classes name no "btn"/"button" (Tailwind-style), and
     anchors that only look padded. (1) a filled CTA on the white page, (2) an outline CTA (transparent
     fill, a 1px border on all four sides), (3) a padded anchor whose fill is the page's own white, in a
     paragraph, (4) a plain text link in a paragraph. Each has its own colours so each is its own
     measured style. Served from 127.0.0.1; never a real site. -->
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #111; }
  header { display: flex; gap: 24px; padding: 16px 40px; }
  header a { color: #0d2b25; text-decoration: none; }
  main { padding: 0 40px; }
  h1 { font: 700 40px/1.2 Arial; margin: 32px 0 16px; }
  p { font: 400 16px/1.5 Arial; }
  .wrap { padding: 24px 0 40px; display: flex; gap: 24px; align-items: center; }
  .go { display: inline-flex; align-items: center; padding: 12px 24px; background: #8e24aa; color: #fff;
        border-radius: 6px; font: 600 14px/1.4 Arial; text-decoration: none; }
  .ring { display: inline-flex; align-items: center; padding: 10px 20px; background: transparent;
          color: #00796b; border: 1px solid #00796b; border-radius: 6px; font: 600 14px/1.4 Arial;
          text-decoration: none; }
  .soft { background: #fff; padding: 8px 12px; color: #5d4037; text-decoration: none; }
  .more { color: #c62828; }
  section.band { padding: 60px 40px; background: #014036; color: #fff; }
</style></head>
<body>
<header><nav><a href="#home">Home</a> <a href="#pricing">Pricing</a></nav></header>
<main>
  <h1>Anchors that call to action</h1>
  <p>Some anchors carry a box; this one is padded but <a href="#plans" class="soft" id="a-soft">filled white</a> on a white page.</p>
  <p>And this is a plain <a href="#more" class="more" id="a-more">text link</a> in a sentence.</p>
  <div class="wrap">
    <a href="#go" class="go" id="a-go">Get started</a>
    <a href="#tour" class="ring" id="a-ring">Take the tour</a>
  </div>
</main>
<section class="band"><h2>The statement band</h2><p>Light text on a dark band.</p></section>
</body></html>
