[workspace]
resolver = "2"
members = [
  "crates/lumen-api-helper",
  "crates/lumen-core",
  "crates/lumen-export",
  "crates/lumen-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
