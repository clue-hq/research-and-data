[workspace]
resolver = "2"
members = [
  "crates/lumen-api-helper",
  "crates/lumen-assets",
  "crates/lumen-core",
  "crates/lumen-export",
  "crates/lumen-agent",
  "crates/lumen-skia",
  "crates/lumen-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned workspace-wide: this exact skia-safe version is the contract the
# Wave 3 CanvasKit build must match (same Skia milestone, same shaping).
# Feature set is chosen to hit a published prebuilt binary for CPU-only
# servers (textlayout + svg + webp, no GPU backends); changing features can
# silently force a from-source Skia build.
skia-safe = { version = "=0.97.2", features = ["textlayout", "svg", "webp"] }
