name: Conformance

on:
  pull_request:
  push:
    branches:
      - main
      - "contracts/**"
      - "qa/**"
      - "engine/**"
      - "editor/**"
      - "export/**"
      - "api/**"

jobs:
  rust-contract:
    name: Rust Contract Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --check

      - name: Run native tests
        run: cargo test

      - name: Run visual regression skeleton
        run: cargo test --test visual_regression -- --ignored

      # Scoped to the wasm-clean crates: lumen-skia binds native C++ Skia
      # and can never target wasm32 (Wave 1 Track A Decision 1).
      - name: Check wasm compile
        run: cargo check --target wasm32-unknown-unknown -p lumen-core -p lumen-wasm

  browser-wasm-core:
    name: Browser WASM Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install editor dependencies
        run: npm --prefix apps/editor ci

      # Builds crates/lumen-wasm via wasm-pack and asserts the Track E
      # bundle budget: gzipped .wasm < 3MB.
      - name: Build wasm module and assert size budget
        run: npm --prefix apps/editor run build:wasm

      - name: Run editor tests (real wasm engine)
        run: npm --prefix apps/editor test -- --run

      - name: Type-check editor
        run: npm --prefix apps/editor run lint

      - name: Build editor (flag on)
        run: NEXT_PUBLIC_LUMEN_WASM_CORE=1 npm --prefix apps/editor run build

  api-persistence:
    name: API Persistence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node for the constrained component compiler
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and test custom-component compiler
        run: |
          npm --prefix apps/custom-component-compiler ci
          npm --prefix apps/custom-component-compiler test

      - name: Install API test dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Build Rust API helper
        run: cargo build -p lumen-api-helper

      - name: Run API tests
        run: pytest apps/api/tests
