name: deploy-images
# First deployment spec §9.1, §9.5: build the backend and sandbox images, prove they boot, then —
# only on a push to main (the deployment branch) — move the `production` tags the VM deploys from.
# A pull request into main runs every check without moving the tags, so a release PR proves its
# images before it can be merged. No test suite runs here: these are boot checks, minutes long.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BACKEND: ghcr.io/clue-hq/clue-backend
  SANDBOX: ghcr.io/clue-hq/clue-agent-sandbox

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The backend image (Skia compiled from source, Chromium, the Python environment) does not fit
      # in the runner's default free disk; drop preinstalled toolchains this job never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: docker/agent-sandbox
          platforms: linux/amd64
          push: true
          tags: ${{ env.SANDBOX }}:${{ github.sha }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Pull the images just built
        run: |
          docker pull "$BACKEND:${{ github.sha }}"
          docker pull "$SANDBOX:${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Engine handshake — committed browser wasm vs the helper inside the built image
        env:
          HANDSHAKE_HELPER_CMD: >-
            docker run --rm -i --entrypoint /app/subsystems/clue-design/target/release/lumen-api-helper
            ${{ env.BACKEND }}:${{ github.sha }}
        run: |
          WASM_PREFLIGHT_STRICT=1 node subsystems/clue-design/scripts/preflight_editor_wasm.mjs
          node subsystems/clue-design/scripts/verify_handshake.mjs
      - name: Static smoke (contents)
        run: docker/backend/smoke.sh "$BACKEND:${{ github.sha }}"
      - name: Boot smoke (every service starts)
        run: |
          # Self-contained: starts its own Postgres (pgvector), Redis and an S3 server on a private network.
          docker/backend/boot_smoke.sh "$BACKEND:${{ github.sha }}" "$SANDBOX:${{ github.sha }}"
      - name: Move the production tags (only after every check above passed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create -t "$BACKEND:production" "$BACKEND:${{ github.sha }}"
          docker buildx imagetools create -t "$SANDBOX:production" "$SANDBOX:${{ github.sha }}"
      # Railway's platform-api and design-api run the image just tagged (their source is
      # ghcr.io/clue-hq/clue-backend:production); they never build it themselves. platform-api goes
      # first: its pre-deploy `clue migrate` brings the schema to head before design-api starts.
      # page-origin builds from main on Railway, which can finish before the migration and then fail
      # on a missing table (2026-10-03); redeploying it last puts it on the migrated schema.
      - name: Redeploy the Railway backends from the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli@5.63.1
          deploy/railway_redeploy.sh platform-api
          deploy/railway_redeploy.sh design-api
          deploy/railway_redeploy.sh page-origin
      # The worker VM runs the same image; it goes last, once platform-api's pre-deploy migration has
      # run (deploy.sh refuses a database behind head). CI's key can do nothing but this: on the VM it
      # is forced to deploy/vm/ci_deploy.sh, which accepts one full commit sha and nothing else. The
      # host key is pinned. Until the secrets exist this warns and skips (deploy.sh by hand, §7).
      - name: Deploy the worker VM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          if [ -z "$VM_SSH_KEY" ] || [ -z "$VM_SSH_KNOWN_HOSTS" ] || [ -z "$VM_HOST" ]; then
            echo "::warning::VM deploy not configured (secrets VM_SSH_KEY, VM_SSH_KNOWN_HOSTS; variable VM_HOST): run deploy.sh ${{ github.sha }} on the VM by hand"
            exit 0
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/vm_deploy"
          chmod 600 "$HOME/.ssh/vm_deploy"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/vm_known_hosts"
          ssh -i "$HOME/.ssh/vm_deploy" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/vm_known_hosts" \
            clue@"$VM_HOST" "${{ github.sha }}"
