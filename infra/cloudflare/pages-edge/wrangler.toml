name = "pages-edge"
main = "worker.js"
compatibility_date = "2026-09-01"

# Route (founder rulings 2026-10-15/16; runbook §9 of docs/specs/pages-hosting-runbook.md): every
# published page lives on cluehq.page — `<label>.cluehq.page` workspace addresses and customers' own
# domains, which reach Cloudflare for SaaS on the cluehq.page zone through a CNAME to cluehq.page.
# The Worker runs on that zone ALONE: cluehq.ai (the app) carries no page traffic and no route, so
# no setting here can ever send an app host to the page origin. It never runs for DNS-only
# (grey-cloud) records. release.test.js pins this file's values.
routes = [{ pattern = "*/*", zone_name = "cluehq.page" }]

[vars]
SYSTEM_SUFFIX = "cluehq.page"
ORIGIN_HOST = "page-origin.cluehq.ai"
# EDGE_SECRET is a secret: `wrangler secret put EDGE_SECRET` — never in this file.
# No cluehq.ai route, so no legacy suffix to redirect from (no *.pages.cluehq.ai address ever
# served in production). A later move off cluehq.page follows runbook §8 with this list.
LEGACY_SYSTEM_SUFFIXES = ""
# Review finding K3-8: the site editor's domain. Its hosts always pass through untouched, so a pages
# domain on the editor's registrable domain can never take every workspace's editor down.
EDITOR_SUFFIX = "edit.deeppresence.ai"
