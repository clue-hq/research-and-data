name = "pages-edge"
main = "worker.js"
compatibility_date = "2026-09-01"

# Route: the zone-wide wildcard so the Worker runs for *.pages.cluehq.ai AND every Cloudflare for
# SaaS custom hostname (which resolve through the fallback origin pages.cluehq.ai). It never runs
# for DNS-only (grey-cloud) records such as app.cluehq.ai, and passes through any other proxied
# record in the zone (see routing.js). Verify in S0 with one real custom hostname (spec §3 item 6).
routes = [{ pattern = "*/*", zone_name = "cluehq.ai" }]

[vars]
SYSTEM_SUFFIX = "pages.cluehq.ai"
ORIGIN_HOST = "page-origin.cluehq.ai"
# EDGE_SECRET is a secret: `wrangler secret put EDGE_SECRET` — never in this file.
# Wave 2 Contract 9 — published pages on their own domain. Empty today. The move takes TWO deploys
# of this file (runbook §8): step 2 adds only a second route `{ pattern = "*/*", zone_name = "<new
# domain>" }` (vars unchanged; the new hosts are forwarded and served at once); step 5, last, sets
# SYSTEM_SUFFIX to the new domain and LEGACY_SYSTEM_SUFFIXES = "pages.cluehq.ai", which turns on
# the 301 from every <label>.pages.cluehq.ai URL to <label>.<new domain>. Never the two in one
# deploy before the new addresses serve (review finding K3-6).
LEGACY_SYSTEM_SUFFIXES = ""
# Review finding K3-8: the site editor's domain. Its hosts always pass through untouched, so a pages
# domain on the editor's registrable domain can never take every workspace's editor down.
EDITOR_SUFFIX = "edit.deeppresence.ai"
