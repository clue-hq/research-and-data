schema_version: "1"
scenarios:
  - name: show_accounts_only
    user_turns: ["Show me the discovered accounts only."]
    scripted_actions: [render_accounts, finalize_awaiting_input]
    required_guidance: "Discovery and tiering never imply account research."
    explicit_launch_go_ahead: false
  - name: discover_more
    user_turns: ["These are too few. Discover more accounts."]
    scripted_actions: [recommend_separate_discovery, finalize_awaiting_input]
    required_guidance: "The user may inspect accounts, discover more, refine questions, revise source policy"
    explicit_launch_go_ahead: false
  - name: five_accounts_with_fax_referral_direction
    user_turns:
      - "Research these five accounts, especially fax and referral coordination friction."
    scripted_actions: [render_working_preview, distinguish_fields_from_hypotheses]
    required_guidance: "Keep qualitative\nExa questions distinct from structured Sumble organization fields."
    explicit_launch_go_ahead: false
  - name: remove_phone_reveals
    user_turns: ["Remove phone reveals from the plan."]
    scripted_actions: [set_contact_reveals_false, render_working_preview]
    required_guidance: "Before account launch, present the exact accounts, fields, directional questions, admitted source\nplans, committee scope, privacy constraints, estimate, cap, and unresolved gates."
    explicit_launch_go_ahead: false
  - name: edit_before_confirm
    user_turns:
      - "Research these five accounts."
      - "Before I confirm, add fax and referral evidence and remove the blocker persona."
      - "Prepare that settled plan for confirmation."
    scripted_actions: [render_working_preview, revise_working_preview, draft_directive]
    required_guidance: "This is a conversational procedure around\nseparately confirmed durable launches."
    explicit_launch_go_ahead: false
  - name: edit_after_launch
    user_turns:
      - "The current fleet is running. Add DAC coordination to future research."
    scripted_actions: [explain_frozen_launch, draft_successor_for_future_work]
    required_guidance: "Keep conversing while either detached fleet runs."
    explicit_launch_go_ahead: false
  - name: explicit_launch
    user_turns:
      - "The confirmed plan, five accounts, and 1500-cent estimate look right. Proceed now."
    scripted_actions: [launch_account_research, report_receipt_as_enqueued_not_complete]
    required_guidance: "Call `launch_account_research@1` only after the current user action explicitly approves the exact\nconfirmed directive, account set, estimate, and cap."
    explicit_launch_go_ahead: true
