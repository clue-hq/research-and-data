[project]
name = "clue-obs"
version = "0.0.0"
description = "Clue platform observability — the ONE structlog configuration, redaction, spans, and test capture (Doc R §4; ported from havana's py_lumen_obs)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "structlog>=24",
    # the OTel tracing skeleton (clue_obs.otel, ex clue_research/obs — M0.5)
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "clue-config",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "sentry-sdk>=2.30",
    # Langfuse (lane 3 slice 3): the OTel-based SDK, attached to the process provider
    "langfuse>=4.15,<5",
]

[tool.uv.sources]
clue-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_obs"]
