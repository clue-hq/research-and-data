[project]
name = "clue-obs"
version = "0.0.0"
description = "Clue platform observability — the ONE structlog configuration, redaction, spans, and test capture (Doc R §4; ported from havana's py_lumen_obs)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_obs"]
