[project]
name = "clue-gateway"
version = "0.0.0"
description = "Clue platform LLM gateway — the ONE model egress (OpenRouter client + CI stub + tracing wrapper) (Doc R)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "openai>=2.45,<3",
    "langchain-openai==1.4.1",
    "clue-core",
    "clue-config",
    "clue-obs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_gateway"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-config = { workspace = true }
clue-obs = { workspace = true }
