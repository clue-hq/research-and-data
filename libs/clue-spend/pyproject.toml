[project]
name = "clue-spend"
version = "0.0.0"
description = "The provider-caller seam: estimate before the wire, raw before parse, one ledger of record."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    # the one HTTP library behind clue_spend.transport.HttpxTransport — lazy-imported inside
    # ``send``, so importing the seam never needs it, but a caller that uses the live transport
    # does (it moved here with the module).
    "httpx>=0.28",
    "clue-core",
    "clue-obs",
    "clue-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_spend"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-obs = { workspace = true }
clue-storage = { workspace = true }
