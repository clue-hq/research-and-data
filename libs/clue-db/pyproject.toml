[project]
name = "clue-db"
version = "0.0.0"
description = "Clue platform DB seam — async engine/session management + alembic env glue (Doc R)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "pgvector",
    "clue-obs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_db"]

[tool.uv.sources]
clue-obs = { workspace = true }
