[project]
name = "clue-core"
version = "0.0.0"
description = "Clue platform shared kernel — domain types, enums, protocols (Resolver, gates), ids, canonical-json. Imports nothing internal (Doc R)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_core"]
