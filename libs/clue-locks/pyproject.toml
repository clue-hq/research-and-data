[project]
name = "clue-locks"
version = "0.0.0"
description = "Clue platform distributed locks — Redis in-flight entity locks + token-bucket rate limiting (Doc R)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "redis>=5",
    "clue-core",
    "clue-obs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_locks"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-obs = { workspace = true }
