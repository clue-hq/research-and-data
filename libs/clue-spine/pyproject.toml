[project]
name = "clue-spine"
version = "0.0.0"
description = "Clue platform object spine — workspace-owned brands/projects and brand-owned products + plain async CRUD (Phase A3.2)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "clue-core",
    "clue-db",
    # Custom-domain publishing S2: registrable-domain / public-suffix parsing for the apex and
    # one-label rules on a customer hostname.
    "tldextract>=5,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_spine"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-db = { workspace = true }
