[project]
name = "clue-config"
version = "0.0.0"
description = "Clue platform config seam — settings, secrets, policy-as-data schemas, layered config loaders (Doc R)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "clue-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_config"]

[tool.uv.sources]
clue-core = { workspace = true }
