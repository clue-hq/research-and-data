# Clue platform backend — uv workspace root (Doc R). Virtual root: the deployable packages
# live in libs/ · subsystems/ · platform/; this file holds the workspace + shared tooling.

[dependency-groups]
# What a deployment needs beyond the members' own dependencies. The backend image installs it
# (`uv sync --no-dev --group deploy`); `dev` includes it, so local environments are unchanged.
deploy = [
    "alembic",               # migrations CLI (`clue migrate`; env.py imports clue_db; run from the workspace root)
    "clue-storage[s3]",      # the S3/R2 storage backend's SDK (aioboto3), lazy-imported in clue_storage/s3.py
]
# Dev toolchain — the M0.1 enforcement baseline. Pinned loosely; uv.lock pins exact versions.
dev = [
    { include-group = "deploy" },
    "ruff>=0.6",          # formatter + linter (replaces black/flake8/isort)
    "mypy>=1.11",         # static ("compile-time") type checker
    "import-linter>=2.0", # machine-enforced modular dependency rules (the M0.1 seam contracts)
    "pytest>=8.2",        # structure + contract tests (M0.6 grows this into the full harness)
    "types-PyYAML>=6",    # strict typing for C6's folder-backed prompt/skill/profile catalog
    "fakeredis>=2.20",    # M2.4 — in-process Redis fake for the lock tests when no Redis is reachable
    "aioboto3>=13",       # B2 — the S3-leg of the storage contract suite (MinIO)
]

[tool.uv.sources]
clue-storage = { workspace = true }

# --- uv workspace (Doc R): libs/ now; subsystems/ + platform/ join in later phases ---
[tool.uv.workspace]
members = [
    "libs/*",
    "subsystems/*",
    "platform/*",
    # D2.1 (PD contract R3): the design API app re-enters the workspace as an explicit member
    # by exact path — the clue-design exclude below keeps the rest of the merged three-language
    # tree out until Part-I Step-2 hygiene runs.
    "subsystems/clue-design/apps/api",
    # D5: the design agent runtime joins on the same terms. It must be an INSTALLED package (not
    # a sys.path insertion) before a fleet worker can import it out of process, and entering the
    # workspace is what forces its deepagents pin to be the platform's one — the "one version
    # story" treaty.
    "subsystems/clue-design/apps/agent_runtime",
    # D5 Round B (R-D5-B1): the two design-tree shims become real installed packages on the same
    # terms. A fleet worker importing `lumen_agent.harness` out of process cannot rely on
    # `PYTHONPATH=subsystems/clue-design`, and `ensure_agent_runtime_path`'s sys.path insertion is
    # deleted this round. Packaging only — the Step-2 fold into clue_obs/clue_config is future work.
    "subsystems/clue-design/packages/py-lumen-obs",
    "subsystems/clue-design/packages/py-lumen-config",
]
exclude = ["subsystems/clue-design"]

# --- ruff: format + lint ----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["subsystems", "platform", "tests", "libs"]
# `trials/` holds throwaway spikes and trial runners (the Puck spike, the web-agent trials), and
# `docs/benchmarks/` one-off report scripts kept beside their reports: outside the product and every
# other gate.
extend-exclude = ["subsystems/clue-design", ".context", "docs/superpowers/drafts", "trials", "docs/benchmarks"]

[tool.ruff.lint]
# T20 (flake8-print): `print` is banned outside the sanctioned CLI/demo surfaces — structured
# logging goes through clue_obs (Doc R §4 "enforced, not trusted").
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
# Sanctioned print surfaces: operator-facing CLIs/demos and the offline run-scripts.
"subsystems/research/clue_research/evals/**" = ["T20"]
"subsystems/research/clue_research/verification/eval_cli.py" = ["T20"]
"subsystems/design/clue_design/evals/__main__.py" = ["T20"]
# The operating-manual builder: `make manual` / `make manual-check` tell an operator which
# chapters were written or which are stale, on stdout, the way every other build target does.
"platform/agents/clue_agents/manual/build.py" = ["T20"]
"platform/agents/clue_agents/manual/fields_snapshot.py" = ["T20"]
"platform/api/clue_api/manual_build.py" = ["T20"]
"scripts/**" = ["T20"]
"tests/**" = ["T20"]
# The site editor's browser tests carry the JavaScript they run in the page inline, one statement a
# line, the way it reads in the browser.
"tests/site_editor/**" = ["E501"]
# An applied migration (main's): its one long line is inside the SQL it ran, never rewritten.
"alembic/versions/9429b503cc9d_design_asset_image_embeddings.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["clue_research", "clue_obs", "clue_core", "clue_spend", "clue_db", "clue_config", "clue_gateway", "clue_locks", "clue_spine", "clue_storage", "clue_auth", "clue_api", "clue_memory", "clue_content", "clue_design", "clue_toolbelt", "clue_agents", "clue_execution", "clue_fleet", "clue_projections", "clue_page_origin"]

# --- mypy: static type checking (with the pydantic plugin) ------------------
[tool.mypy]
python_version = "3.12"
files = ["subsystems/research/clue_research", "libs/clue-obs/clue_obs", "libs/clue-core/clue_core", "libs/clue-db/clue_db", "libs/clue-config/clue_config", "libs/clue-gateway/clue_gateway", "libs/clue-locks/clue_locks", "libs/clue-spine/clue_spine", "libs/clue-storage/clue_storage", "libs/clue-spend/clue_spend", "subsystems/memory/clue_memory", "subsystems/content/clue_content", "subsystems/design/clue_design", "platform/auth/clue_auth", "platform/toolbelt/clue_toolbelt", "platform/agents/clue_agents", "platform/execution/clue_execution", "platform/fleet/clue_fleet", "platform/projections/clue_projections", "platform/api/clue_api", "platform/page_origin/clue_page_origin"]
mypy_path = "libs/clue-spend:subsystems/research:subsystems/memory:subsystems/content:subsystems/design:platform/auth:platform/toolbelt:platform/agents:platform/execution:platform/fleet:platform/projections:platform/api:libs/clue-obs:libs/clue-core:libs/clue-db:libs/clue-config:libs/clue-gateway:libs/clue-locks:libs/clue-spine:libs/clue-storage:platform/page_origin"
explicit_package_bases = true
namespace_packages = true
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# The OpenAI-compatible SDK is an external boundary used only behind the gateway/ seam, where the
# client is deliberately treated as ``Any`` (duck-typed against an injectable fake). Skip its stubs
# so the gateway is decoupled from the SDK's exact typed signature (a version-drift hazard).
[[tool.mypy.overrides]]
module = ["openai"]
follow_imports = "skip"
ignore_missing_imports = true

# M4.3/M4.5 — the PDF (pypdf) and scrape (firecrawl) libraries are external boundaries used ONLY
# behind the adapters/provider seams (PdfTextExtractor / ScrapeBackend), lazy-imported and
# duck-typed. The research subsystem declares the live Firecrawl SDK, while tests inject doubles.
# Ignore missing stubs so the adapter framework stays decoupled from each SDK's typed signature.
[[tool.mypy.overrides]]
module = ["pypdf", "firecrawl"]
follow_imports = "skip"
ignore_missing_imports = true

# B2 — the S3 SDK is an external boundary used ONLY behind the clue_storage.s3 seam, lazy-imported
# and duck-typed (the client is deliberately ``Any``, same stance as the OpenAI SDK above).
# Scrapling + markdownify (B2.4) are the credit-free ScrapeBackend's libraries, likewise lazy
# behind adapters/concrete (Rule 4).
[[tool.mypy.overrides]]
module = ["aioboto3", "aiobotocore.*", "curl_cffi.*", "scrapling.*", "markdownify"]
follow_imports = "skip"
ignore_missing_imports = true

# Part II D5 Round B — the merged design app is an external boundary to the platform's type
# check. `clue_api.design_fleet` lazy-imports `lumen_api.fleet_handler` to register the design
# work handler with the fleet worker, but the design tree carries no `py.typed` marker and is
# NOT in this file's mypy `files`/`mypy_path` (it is out of the root lint until Part-I Step-2).
# Same stance as the SDK boundaries above: the handler is duck-typed at the seam against the
# `WorkHandler` protocol, whose kind is re-checked at construction, so nothing is silently
# unchecked — the protocol conformance is enforced at runtime instead of statically.
# `lumen_agent.*` joined it in lane 3 slice 5: the leg lane lazy-imports
# `lumen_agent.usage_collector.TurnCallbacks` to hand the design side its per-turn Langfuse
# handler — same tree, same missing marker, same duck-typed seam.
[[tool.mypy.overrides]]
module = ["lumen_agent.*", "lumen_api.*"]
follow_imports = "skip"
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# This is the configfile for the clue-design suites too (they run from
# `subsystems/clue-design` but pytest walks up to this rootdir). `fastapi.testclient`
# raises this at IMPORT, once per run, and the design suites' shared conftest imports it
# — pre-existing third-party noise with no action for us until fastapi ships httpx2.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
    # SWIG registers its helper types when `pymupdf` is first imported (the design ladder's lazy
    # `logo_ladder._rasterize` import), and Python 3.12 warns about each. Third-party, nothing to
    # act on. The message field is a regex; no module qualifier because it is raised from
    # `<frozen importlib._bootstrap>`, not from pymupdf itself.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

# --- import-linter: the executable form of the modular-boundary rules -------
# These five contracts ARE the M0.1 deliverable: they make "any component is replaceable without
# breaking its neighbours" a machine-checked fact. Run via `make contracts` (and in CI).
[tool.importlinter]
root_packages = ["clue_research", "clue_core", "clue_obs", "clue_spend", "clue_db", "clue_config", "clue_gateway", "clue_locks", "clue_spine", "clue_storage", "clue_auth", "clue_memory", "clue_content", "clue_design", "clue_toolbelt", "clue_agents", "clue_execution", "clue_fleet", "clue_projections", "clue_api", "clue_page_origin"]
include_external_packages = true  # required so provider-SDK (external) imports can be forbidden

[[tool.importlinter.contracts]]
name = "auth substrate depends inward, never on subsystems or capability planes"
type = "forbidden"
source_modules = ["clue_auth"]
forbidden_modules = ["clue_research", "clue_memory", "clue_content", "clue_design", "clue_toolbelt", "clue_agents", "clue_execution", "clue_fleet", "clue_projections", "clue_api", "clue_gateway", "clue_locks", "clue_storage"]

# Rule 2 — core/ is the shared kernel: it imports nothing else inside clue_research.
[[tool.importlinter.contracts]]
name = "core is the shared kernel (imports nothing internal)"
type = "forbidden"
source_modules = ["clue_core"]
forbidden_modules = ["clue_research", "clue_obs", "clue_db", "clue_config", "clue_gateway", "clue_locks", "clue_spine", "clue_storage"]

# Rule 1 (shape) — the shared base stays layered, now across root-level libs:
# clue_obs (top) -> clue_config -> clue_core (bottom). Lower layers never import higher ones.
[[tool.importlinter.contracts]]
name = "shared base is layered: obs -> config -> core"
type = "layers"
layers = ["clue_obs", "clue_config", "clue_core"]

# Rule 1b — config must not reach back into the subsystem or sideways into db.
[[tool.importlinter.contracts]]
name = "config imports only core (no subsystem/db backreach)"
type = "forbidden"
source_modules = ["clue_config"]
forbidden_modules = ["clue_research", "clue_db"]

# Rule 3 — workers coordinate through the claim store, never by importing a sibling worker. Judges
# live in verification/; scorers in discovery_scoring/. M4.5 carve-out: a resolver whose source needs
# ADAPTATION (Firecrawl's tier-2 scrape) runs the M4.3 adapter framework via `adapters.run_chain`, so
# `resolvers -> adapters` is the ONE permitted worker→worker edge — expressed DIRECTIONALLY below
# (independence would also forbid it). The adapter framework stays a pure leaf: it never imports a
# resolver (the seam is one-way, exactly like `sources -> resolvers`, Rule 3c).
#
# Beat-0 (M5–M9 parallelisation) widens this to EVERY milestone worker package: stage0 (M5),
# discovery_scoring (M6), durable (M7), profiling (M8), verification (M9), narrative (M12),
# compliance (M10), synthesis (M11), review (M13) are all mutually independent. This is what makes
# the milestones safe to build on parallel branches: a branch literally cannot import another
# milestone's package. Cross-milestone contracts live in `core` (e.g. the `PhaseHandler` /
# `AspectWorker` / `BudgetEngine` execution seams and the verification gate protocols) and concrete
# implementations are wired together only at the `api` composition root (which is exempt — nothing
# imports api, Rule 5). Each still imports the shared base (core/config/obs) and the M1–M4 services
# (claimstore/identity/icp/sources) freely; the ban is strictly worker→sibling-worker.
[[tool.importlinter.contracts]]
name = "workers are independent (adapters / judges / scorers / milestone packages)"
type = "independence"
modules = [
    "clue_research.adapters",
    "clue_research.verification",
    "clue_research.discovery_scoring",
    "clue_research.stage0",
    "clue_research.official_site",
    "clue_research.durable",
    "clue_research.profiling",
    "clue_research.narrative",
    "clue_research.compliance",
    "clue_research.synthesis",
    "clue_research.review",
]
ignore_imports = [
    # C3's provider packages implement the frozen PageFetcher seam. These exact imports are the
    # intended contract/safety direction; every other adapter <-> official_site edge stays banned.
    "clue_research.adapters.firecrawl_page -> clue_research.official_site.contracts",
    "clue_research.adapters.page_fetcher_common -> clue_research.official_site.contracts",
    "clue_research.adapters.page_fetcher_common -> clue_research.official_site.discovery",
    "clue_research.adapters.scrapling_page -> clue_research.official_site.contracts",
    "clue_research.adapters.scrapling_page -> clue_research.official_site.safety",
]

# Rule 3a — resolvers import no sibling worker EXCEPT the adapter framework (the M4.5 carve-out): a
# resolver may call `adapters.run_chain` (Firecrawl scrape → M4.3 HTML→markdown adapter), but never a
# judge (verification/) or a scorer (discovery_scoring/). `resolvers -> adapters` is intentionally
# omitted here, i.e. permitted; the dependency is one-way (Rule 3b keeps adapters from importing back).
[[tool.importlinter.contracts]]
name = "resolvers import no sibling worker except the adapter framework"
type = "forbidden"
source_modules = ["clue_research.resolvers"]
forbidden_modules = [
    "clue_research.verification",
    "clue_research.discovery_scoring",
    "clue_research.stage0",
    "clue_research.durable",
    "clue_research.profiling",
    "clue_research.narrative",
    "clue_research.compliance",
    "clue_research.synthesis",
    "clue_research.review",
]

# Rule 3b — the worker leaves never import resolvers (the one-way worker seam): a resolver registers
# itself into the source registry and calls the adapter framework, never the reverse — so an adapter,
# judge, or scorer can never learn a concrete provider exists. Mirrors Rule 3c (`sources -> resolvers`
# forbidden); together they make `resolvers -> adapters` a strictly one-directional dependency.
[[tool.importlinter.contracts]]
name = "adapters / judges / scorers do not import resolvers (one-way worker seam)"
type = "forbidden"
source_modules = [
    "clue_research.adapters",
    "clue_research.verification",
    "clue_research.discovery_scoring",
    "clue_research.stage0",
    "clue_research.durable",
    "clue_research.profiling",
    "clue_research.narrative",
    "clue_research.compliance",
    "clue_research.synthesis",
    "clue_research.review",
]
forbidden_modules = ["clue_research.resolvers"]

# Rule 4 — provider SDKs live only behind resolvers/<provider> and adapters/<source>.
# Every package EXCEPT resolvers/ and adapters/ is forbidden from importing a provider SDK, so the
# provider name never leaks downstream (swapping Clay -> direct APIs stays a config/registry change).
# The SDK list is illustrative; M4 finalizes the exact import names as providers are chosen.
[[tool.importlinter.contracts]]
name = "provider SDKs only behind resolvers/<provider> and adapters/<source>"
type = "forbidden"
source_modules = [
    "clue_core",
    "clue_config",
    "clue_obs",
    "clue_db",
    "clue_gateway",
    "clue_locks",
    "clue_spine",
    "clue_spend",
    "clue_research.evals",
    "clue_research.claimstore",
    "clue_research.identity",
    "clue_locks",
    "clue_research.icp",
    "clue_research.sources",
    "clue_research.stage0",
    "clue_research.official_site",
    "clue_research.discovery_scoring",
    "clue_research.durable",
    "clue_research.profiling",
    "clue_research.verification",
    "clue_research.compliance",
    "clue_research.synthesis",
    "clue_research.narrative",
    "clue_research.review",
    "clue_agents",
    "clue_api",
]
forbidden_modules = [
    "clay",
    "apollo",
    "zoominfo",
    "builtwith",
    "exa_py",
    "parallel",
    "firecrawl",
    "scrapling",
    "curl_cffi",
    "markdownify",
    "simple_salesforce",
    "hubspot",
]
# The ONE sanctioned SDK location: the Firecrawl SDK is imported lazily, inside a function, *behind
# the M4.3 adapter seam* (``adapters.concrete._build_client``, ``# pragma: no cover`` live path). The
# adapter seam is exactly where a provider SDK is allowed to live (Rule 4 — "behind adapters/<source>").
# import-linter follows that lazy edge, so without this exemption the `api` composition root could
# never wire ANY resolver (importing ``resolvers`` transitively reaches the firecrawl resolver →
# adapters → this lazy SDK import) — defeating the whole point of the composition root. Ignoring this
# single sanctioned edge severs that transitive path; a *direct* SDK import by any source module is a
# different edge and is still caught. (M11 is the first api-root resolver wiring to need this; the
# deferred firecrawl/deterministic composition-root wiring needs it identically.)
# B2.4 adds the scrapling backend beside it — same sanctioned lazy edges, same seam.
ignore_imports = [
    "clue_research.adapters.concrete -> firecrawl",
    "clue_research.adapters.concrete -> scrapling",
    "clue_research.adapters.concrete -> markdownify",
    "clue_research.adapters.firecrawl_page -> firecrawl",
    "clue_research.adapters.scrapling_page -> scrapling",
    "clue_research.adapters.scrapling_page -> curl_cffi",
]

# Rule 4b — the LLM-vendor SDK lives ONLY behind the gateway/ package (the model analogue of
# Rule 4 for data-source SDKs). The gateway is the single egress for every *direct* LLM call
# (conventions §2/§4): no component constructs an OpenAI-compatible client directly, so a model
# swap (or OpenRouter -> another gateway) stays a config change. (Exa/Parallel are resolvers, not
# gateway calls — their SDKs are governed by Rule 4 above.)
[[tool.importlinter.contracts]]
name = "the LLM-vendor SDK lives only behind the gateway/ package"
type = "forbidden"
source_modules = [
    "clue_core",
    "clue_config",
    "clue_obs",
    "clue_db",
    "clue_locks",
    "clue_spine",
    "clue_spend",
    "clue_research.evals",
    "clue_research.claimstore",
    "clue_research.identity",
    "clue_locks",
    "clue_research.icp",
    "clue_research.sources",
    "clue_research.resolvers",
    "clue_research.adapters",
    "clue_research.stage0",
    "clue_research.discovery_scoring",
    "clue_research.durable",
    "clue_research.profiling",
    "clue_research.verification",
    "clue_research.compliance",
    "clue_research.synthesis",
    "clue_research.narrative",
    "clue_research.review",
    "clue_agents",
    "clue_api",
]
forbidden_modules = ["openai"]
# The sanctioned gateway edges (mirroring the firecrawl exemption above): the api composition root
# builds injected gateway implementations at the two composition modules below. The worker
# entrypoint (``python -m clue_api.fleet_main``) lives *inside* ``clue_api``, so it cannot inject
# the gateway from outside the way ``scripts/`` do. ``clue_gateway`` transitively reaches the
# ``openai`` SDK (its live OpenRouter client), so without severing these exact composition edges
# the root could never build the sanctioned egress. A *direct* ``openai`` import by any source
# module is a different edge and is still caught. A model swap stays a gateway/config change —
# ``clue_api`` never touches the vendor SDK.
ignore_imports = [
    "clue_api.run_composition -> clue_gateway",
    "clue_api.agent_model_wiring -> clue_gateway",
]

# Lane 3 slice 3 — the Langfuse SDK lives only behind ``clue_obs.langfuse`` (the client and every
# platform-side helper) and ``clue_gateway.langfuse_handler`` (the LangChain adapter, which needs
# ``langchain_core`` and so cannot live in the base library; moved out of ``clue_api`` on
# 2026-10-03 so the design subsystem can report its agents through it). Everything else reaches
# Langfuse through those two modules' no-op-when-off helpers.
[[tool.importlinter.contracts]]
name = "the Langfuse SDK lives only behind clue_obs.langfuse and clue_gateway.langfuse_handler"
type = "forbidden"
source_modules = [
    "clue_research",
    "clue_core",
    "clue_config",
    "clue_obs",
    "clue_db",
    "clue_gateway",
    "clue_locks",
    "clue_spine",
    "clue_storage",
    "clue_spend",
    "clue_auth",
    "clue_memory",
    "clue_content",
    "clue_design",
    "clue_toolbelt",
    "clue_agents",
    "clue_execution",
    "clue_fleet",
    "clue_projections",
    "clue_api",
]
forbidden_modules = ["langfuse"]
# External imports are squashed to their top-level package by grimp
# (``include_external_packages``), so the adapter's ``from langfuse.langchain import ...`` is
# recorded — and must be exempted — as the edge to ``langfuse``.
ignore_imports = [
    "clue_obs.langfuse -> langfuse",
    "clue_gateway.langfuse_handler -> langfuse",
]

# Rule 2b — libs are subsystem-agnostic: no lib may import the research subsystem (or api).
[[tool.importlinter.contracts]]
name = "libs never import the subsystem"
type = "forbidden"
source_modules = ["clue_core", "clue_config", "clue_obs", "clue_db", "clue_gateway", "clue_locks", "clue_spine", "clue_storage", "clue_spend"]
forbidden_modules = ["clue_research", "clue_api"]

# Rule 2e (lane 3 slice 5) — the provider-caller seam is importable by ANY subsystem. It is the one
# place a paid call is estimated, recorded raw and settled onto `provider_call_ledger`, so the
# design subsystem imports it directly rather than growing a second implementation. That only works
# while it stays a leaf: it may reach the shared base (core / obs / storage) and SQLAlchemy, and
# nothing else. A `clue_api` import here would drag the whole composition root into the design app;
# a `clue_research` or `clue_projections` import would make the seam a research dependency. The
# design tree's own `lumen_*` packages are outside import-linter's roots, so the source-level guard
# in `tests/spend/test_package_boundary.py` covers those two names.
[[tool.importlinter.contracts]]
name = "the spend seam imports no platform or subsystem internals"
type = "forbidden"
source_modules = ["clue_spend"]
forbidden_modules = ["clue_api", "clue_research", "clue_projections", "clue_agents", "clue_toolbelt", "clue_execution", "clue_fleet", "clue_memory", "clue_content", "clue_design", "clue_gateway", "clue_locks", "clue_spine"]

# Rule 2c — the object spine imports only core + db (mirrors clue-config's Rule 1b): row models +
# plain CRUD, no config/gateway/locks/obs reach and never the subsystem.
[[tool.importlinter.contracts]]
name = "spine imports only core + db"
type = "forbidden"
source_modules = ["clue_spine"]
forbidden_modules = ["clue_research", "clue_config", "clue_gateway", "clue_locks", "clue_obs"]

# Rule 2d (B2) — durable storage imports only core + db + config (config: the settings-driven
# fs↔S3 factory). Never the subsystem (Rule 2b covers that too), never gateway/locks/obs, never
# another lib's internals.
[[tool.importlinter.contracts]]
name = "storage imports only core + db + config"
type = "forbidden"
source_modules = ["clue_storage"]
forbidden_modules = ["clue_research", "clue_gateway", "clue_locks", "clue_obs", "clue_spine"]

# Rule 4c (B2) — the S3 SDK lives ONLY behind clue_storage.s3 (the storage analogue of Rule 4):
# every other workspace package — and every other clue_storage module — is forbidden from
# importing it, so the object-store vendor never leaks past the StorageBackend seam.
[[tool.importlinter.contracts]]
name = "the S3 SDK lives only behind clue_storage.s3"
type = "forbidden"
source_modules = [
    "clue_core",
    "clue_config",
    "clue_obs",
    "clue_db",
    "clue_gateway",
    "clue_locks",
    "clue_spine",
    "clue_spend",
    "clue_storage.protocol",
    "clue_storage.fs",
    "clue_storage.factory",
    "clue_storage.artifacts",
    "clue_storage.snapshot",
    "clue_research",
    "clue_memory",
    "clue_content",
    "clue_design",
    "clue_toolbelt",
    "clue_agents",
    "clue_fleet",
    "clue_projections",
    "clue_api",
]
forbidden_modules = ["aioboto3", "aiobotocore", "boto3", "botocore"]
# The ONE sanctioned SDK edge (mirrors the firecrawl exemption above): the SDK import is lazy,
# inside S3Storage._new_client_context. import-linter follows lazy edges, so without severing this one the
# in-package composition (factory/__init__ -> s3) would transitively trip the contract for every
# source module that imports clue_storage. A *direct* SDK import anywhere else is still caught.
# The pool-size config class (aiobotocore.config) is imported at that same lazy site.
ignore_imports = ["clue_storage.s3 -> aioboto3", "clue_storage.s3 -> aiobotocore"]

# Rule S1 — subsystems are independent: they communicate only through the shared substrates
# (claim store; memory seams), never by importing each other (repo charter).
[[tool.importlinter.contracts]]
name = "subsystems are independent"
type = "independence"
modules = ["clue_research", "clue_memory", "clue_content", "clue_design"]

# Rule S2 — the agents package may reach the shared core, toolbelt facade, and projections only
# (REQ-02): never claim-store writes, resolvers, execution/storage infrastructure, the gateway,
# fleet, object spine, locks, API, or any subsystem directly. Concrete bridges are injected at API.
[[tool.importlinter.contracts]]
name = "agents import only the toolbelt facade + projections"
type = "forbidden"
source_modules = ["clue_agents"]
forbidden_modules = [
    "clue_research",
    "clue_memory",
    "clue_content",
    "clue_execution",
    "clue_fleet",
    "clue_gateway",
    "clue_locks",
    "clue_spine",
    "clue_storage",
    "clue_api",
]

# Rule T1 — toolbelt purity (D5, PB-B4 slice 2): the typed tool envelope is dependency-inverted like
# the resolver seam — it imports ONLY the shared base (clue_core / clue_config / clue_db / clue_obs).
# The concrete tools that actually touch a capability are constructed at the clue_api composition
# root (the only package that may import everything), NOT in clue_toolbelt. So the toolbelt shape
# stays stable while the capabilities behind it evolve, and a tool can never smuggle a research
# import into the pure envelope. Machine-enforced.
[[tool.importlinter.contracts]]
name = "toolbelt imports only the shared base"
type = "forbidden"
source_modules = ["clue_toolbelt"]
forbidden_modules = ["clue_research", "clue_memory", "clue_content", "clue_design", "clue_execution", "clue_fleet", "clue_gateway", "clue_locks", "clue_spine", "clue_storage", "clue_api"]

# Rule E1 — execution owns generic recipe/graph contracts and may depend inward on the toolbelt,
# generic fleet seam, and shared base only. Subsystem/domain adapters bind at clue_api.
[[tool.importlinter.contracts]]
name = "execution imports only toolbelt fleet and shared base"
type = "forbidden"
source_modules = ["clue_execution"]
forbidden_modules = ["clue_research", "clue_memory", "clue_content", "clue_design", "clue_agents", "clue_projections", "clue_gateway", "clue_locks", "clue_spine", "clue_storage", "clue_api"]

# Rule P1 — projections purity (D7, PB-B4 slice 3): the read side may import the clue_research READ
# surfaces (review's ObservabilitySurface panels + the durable/discovery_scoring read helpers) and
# the shared base (clue_core / clue_db), but NEVER the write/execution planes — toolbelt, agents,
# fleet, api, another subsystem (memory/content), the gateway, or the lock lib. The concrete
# durable-backed readers are built at the clue_api composition root and injected in, so the
# projection logic stays a pure read; the run_event EMITTER + the manifest PATCH ops (writes) live
# at that root, never here (a write in clue_projections would break the MVCC-only read discipline).
# Machine-enforced.
[[tool.importlinter.contracts]]
name = "projections import only research read surfaces + shared base"
type = "forbidden"
source_modules = ["clue_projections"]
# Direct imports only (mirrors the fleet F2 contract): projections directly import only the
# clue_research READ surfaces (review / durable / discovery_scoring) + the base; those research
# packages *themselves* legitimately reach clue_locks (durable's Beat-0 entity lock;
# discovery_scoring -> identity -> review), and those transitive edges are their business, not a
# projections leak. A *direct* projections -> forbidden import is still caught.
allow_indirect_imports = "True"
forbidden_modules = ["clue_toolbelt", "clue_agents", "clue_execution", "clue_fleet", "clue_api", "clue_memory", "clue_content", "clue_design", "clue_gateway", "clue_locks"]

# Rule F1 — the fleet is the platform's execution shell AROUND the research subsystem: research
# never imports it (the drive seam is one-way — the worker drives durable's public surface, and
# no research code may learn the queue/lease exist). PB-B1.
[[tool.importlinter.contracts]]
name = "research never imports the fleet shell (one-way drive seam)"
type = "forbidden"
source_modules = ["clue_research"]
forbidden_modules = ["clue_fleet"]

# Rule F2 — the fleet touches research ONLY through the durable seam (the PB-B1 treaty
# must-not-touch list, machine-enforced): never sources/resolvers/adapters, never the judges or
# scorers, never the claim store or another subsystem. The worker drives CampaignRun; the
# queue-backed scheduler implements durable's run_accounts seam — nothing else crosses.
# Direct imports only (allow_indirect_imports): durable itself legitimately reaches
# claimstore/locks (Beat-0), and those transitive edges are durable's business, not a fleet leak.
[[tool.importlinter.contracts]]
name = "fleet touches research only through the durable seam"
type = "forbidden"
source_modules = ["clue_fleet"]
allow_indirect_imports = "True"
forbidden_modules = [
    "clue_research.sources",
    "clue_research.resolvers",
    "clue_research.adapters",
    "clue_research.compliance",
    "clue_research.verification",
    "clue_research.profiling",
    "clue_research.stage0",
    "clue_research.discovery_scoring",
    "clue_research.narrative",
    "clue_research.synthesis",
    "clue_research.review",
    "clue_research.claimstore",
    "clue_research.identity",
    "clue_research.icp",
    "clue_research.evals",
    "clue_memory",
    "clue_content",
    "clue_design",
    "clue_gateway",
    "clue_locks",
    # F2 hardening at B2/B3 integration (PB-B1 audit note): the fleet may not reach the storage
    # lib directly either — snapshots/artifacts are wired at the composition root, and the shell
    # sees only durable's seam.
    "clue_storage",
]

# Rule S3 (PB-B3) — the memory substrate is storage + seams only: it imports core (the seam
# contracts + shared types), db, and config (caps/settings) — nothing else. The gateway concrete
# for its reconcile judge is INJECTED at the composition root (the LLMGateway protocol lives in
# core), so a model swap never touches this package; spine scope validity is DB-constraint
# enforcement, not a clue_spine import. (Rule S1 already keeps other subsystems out entirely.)
[[tool.importlinter.contracts]]
name = "memory substrate imports only core + db + config"
type = "forbidden"
source_modules = ["clue_memory"]
forbidden_modules = [
    "clue_gateway",
    "clue_locks",
    "clue_obs",
    "clue_spine",
    "clue_storage",
    "clue_toolbelt",
    "clue_agents",
    "clue_execution",
    "clue_fleet",
    "clue_projections",
]

# Rule S4 (design-integration Part II, D0) — the design substrate imports only the shared base:
# core (shared types + seam contracts), db (ConnFactory / engine seam), config, obs (tracing),
# and storage (content-addressed assets from D4). Never the gateway (LLM concretes are injected
# at the composition root), locks, spine (workspace/brand validity is DB-constraint enforcement,
# not a clue_spine import), or any execution plane. (Rule S1 keeps other subsystems out; the
# api-layer contract below keeps clue_api out. The merged design apps in subsystems/clue-design/
# consume this package from slice D2 — that edge is outside import-linter's roots until those
# apps re-enter the uv workspace.)
[[tool.importlinter.contracts]]
name = "design substrate imports only core + db + config + obs + storage"
type = "forbidden"
source_modules = ["clue_design"]
forbidden_modules = [
    "clue_auth",
    "clue_gateway",
    "clue_locks",
    "clue_spine",
    "clue_toolbelt",
    "clue_agents",
    "clue_execution",
    "clue_fleet",
    "clue_projections",
]

# Custom-domain publishing S1 — the page origin reads the spine, the design DAL and storage; never a
# capability plane, the research subsystem, or the two API apps.
[[tool.importlinter.contracts]]
name = "page origin imports only core + config + db + obs + spine + design + storage"
type = "forbidden"
source_modules = ["clue_page_origin"]
forbidden_modules = ["clue_research", "clue_api", "clue_auth", "clue_gateway", "clue_locks", "clue_memory", "clue_content", "clue_toolbelt", "clue_agents", "clue_execution", "clue_fleet", "clue_projections"]

# Rule 3c — the source registry's binding seam is one-directional. Resolvers register THEMSELVES
# into the registry (resolvers -> sources via bind_resolver), so sources must NOT import resolvers —
# that would invert the seam and let the registry learn a concrete provider exists. This is a
# dedicated one-way forbidden contract, NOT the independence rule (which would also forbid
# resolvers -> sources and break bind_resolver). sources -> icp stays PERMITTED (the M4.6 planner
# reuses M3.3's source-profile serving — locked decision #7; M3.3 must keep NOT importing M4).
[[tool.importlinter.contracts]]
name = "source registry does not import resolvers (one-way binding seam)"
type = "forbidden"
source_modules = ["clue_research.sources"]
forbidden_modules = ["clue_research.resolvers"]

# Rule 6 — the claim store stays the shared substrate: it must NOT import identity or locks, so the
# M2.5 reuse classifier can never invert the dependency (claimstore persists pre-stamped fields and
# scopes reads; the classifier lives in identity, which imports claimstore — never the reverse).
[[tool.importlinter.contracts]]
name = "claim store does not import identity / locks (no inversion)"
type = "forbidden"
source_modules = ["clue_research.claimstore"]
forbidden_modules = ["clue_research.identity", "clue_locks"]

# Rule 7 — the eval scaffold (evals/) is a CORE-ONLY leaf. It defines the generic gold-set / rubric /
# report shapes every milestone's accuracy battery binds to (M9.6 fills it), so it must import only
# the shared base (core/config/obs) — never the substrate or a worker. The whole M9.6 split rests on
# this: the DB/LLM-backed verification battery lives in verification/ (which MAY import evals); were
# evals to import claimstore/verification/db/gateway it would invert that dependency and create an
# evals<->verification import cycle. The "core is the shared kernel" rule only forbids the reverse
# edge (core->evals); this is its complement, so the invariant is enforced, not merely documented.
[[tool.importlinter.contracts]]
name = "the eval scaffold (evals/) is a core-only leaf"
type = "forbidden"
source_modules = ["clue_research.evals"]
forbidden_modules = [
    "clue_db",
    "clue_research.claimstore",
    "clue_research.identity",
    "clue_locks",
    "clue_research.icp",
    "clue_research.sources",
    "clue_research.resolvers",
    "clue_research.adapters",
    "clue_gateway",
    "clue_research.stage0",
    "clue_research.discovery_scoring",
    "clue_research.durable",
    "clue_research.profiling",
    "clue_research.verification",
    "clue_research.compliance",
    "clue_research.synthesis",
    "clue_research.narrative",
    "clue_research.review",
    "clue_api",
]

# Rule 5 — nothing imports the composition root (platform/api, Doc R R3). Dependencies point
