# Alembic configuration — Clue-HQ research-and-data (M0.3 / ENG-114).
#
# Migrations are the ONLY path that mutates schema (substrate §12; conventions §6). They are
# hand-reviewed, not autogenerated: there are no ORM models to diff against in M0 (domain tables
# land in M1+), and even later the autogenerate-from-models option stays OFF by default
# (migrations are reviewed, not magic — §M0.3).
#
# The DB DSN is NOT stored here. env.py reads it from the CLUE_DATABASE_URL env var (the shared
# seam), reusing clue_research.db.database_url() so the engine and the migrations agree on one DSN
# and no credential is ever committed. (`sqlalchemy.url` is intentionally left blank.)

[alembic]
# Migration scripts live here, relative to repo root.
script_location = alembic

# Numbering/naming convention: zero-padded sequential prefix + slug, e.g.
#   0001_enable_pgvector.py
# `revision`/`down_revision` chain the order; the filename prefix makes the order obvious on disk
# and in review. New migrations: pick the next number, set down_revision to the current head.
file_template = %%(rev)s_%%(slug)s

# Treat observed_at/collected_at and all timestamps as UTC; render naive datetimes in migrations
# as UTC so the "timestamptz, UTC" convention (§M0.3) is the default, not a per-migration choice.
timezone = UTC

# Leave blank — env.py supplies the URL from CLUE_DATABASE_URL. Never commit a DSN here.
sqlalchemy.url =

# Don't truncate the auto-generated slug in filenames.
truncate_slug_length = 40

# Logging — quiet by default; the migration smoke (`make db-smoke`) surfaces what it needs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
