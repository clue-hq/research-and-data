[project]
name = "clue-api"
version = "0.0.0"
description = "THE composition root — FastAPI routers, wiring, treaty DTOs (Doc R R3; the research subsystem's former api/ package promoted)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # the only package that may import everything (Doc R §3)
    "clue-research",
    "clue-core",
    "clue-config",
    "clue-db",
    "clue-obs",
    "clue-storage",
    # lane 3 slice 5: the provider-caller seam ARV2 re-exports (it used to live in clue_api.arv2)
    "clue-spend",
    "clue-execution",
    "clue-fleet",
    "clue-toolbelt",
    "clue-agents",
    "clue-auth",
    # app-layer runtime
    "fastapi>=0.138.0",
    "uvicorn>=0.35.0",
    # ARV2 (R1): the one HTTP library behind clue_api.arv2.transport.HttpxTransport —
    # every ARV2 provider call goes over plain HTTP through the wrapper, never a vendor SDK.
    "httpx>=0.28",
    # Public YouTube audio extraction; EJS support matches the successful Deepgram trial.
    "yt-dlp[default]>=2026.8.19",
    # ARV2 onboarding (O2): YAML front matter on the knowledge documents.
    "pyyaml>=6,<7",
    # Custom-domain publishing S2: DNS lookups for the CNAME verification check.
    "dnspython>=2.6,<3",
    # Custom-domain publishing S2: multipart form parsing on the Settings → Pages uploads.
    "python-multipart>=0.0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_api"]

[tool.uv.sources]
clue-research = { workspace = true }
clue-core = { workspace = true }
clue-config = { workspace = true }
clue-db = { workspace = true }
clue-obs = { workspace = true }
clue-storage = { workspace = true }
clue-spend = { workspace = true }
clue-execution = { workspace = true }
clue-fleet = { workspace = true }
clue-toolbelt = { workspace = true }
clue-agents = { workspace = true }
clue-auth = { workspace = true }
