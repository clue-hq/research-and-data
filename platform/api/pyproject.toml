[project]
name = "clue-api"
version = "0.0.0"
description = "THE composition root — FastAPI routers, wiring, treaty DTOs (Doc R R3; the research subsystem's former api/ package promoted)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # the only package that may import everything (Doc R §3)
    "clue-research",
    "clue-core",
    "clue-config",
    "clue-db",
    "clue-obs",
    "clue-storage",
    "clue-execution",
    "clue-fleet",
    "clue-toolbelt",
    "clue-agents",
    "clue-auth",
    # app-layer runtime
    "fastapi>=0.138.0",
    "uvicorn>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_api"]

[tool.uv.sources]
clue-research = { workspace = true }
clue-core = { workspace = true }
clue-config = { workspace = true }
clue-db = { workspace = true }
clue-obs = { workspace = true }
clue-storage = { workspace = true }
clue-execution = { workspace = true }
clue-fleet = { workspace = true }
clue-toolbelt = { workspace = true }
clue-agents = { workspace = true }
clue-auth = { workspace = true }
