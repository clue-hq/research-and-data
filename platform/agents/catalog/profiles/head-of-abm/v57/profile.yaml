status: active
# v57 (the turn caps move to the founder's numbers, 2026-09-14): v56's surface exactly — the same
# grant, the same skills, the same workspace — with the two numbers that bound a turn raised to
# the ones the founder ruled on 2026-09-08: `turn_timeout_s` 300 → 1800 and `max_model_rounds`
# 24 → 100. A live plan-draft turn (7ffabc38) failed `agent_timeout` at the 300-second wall clock
# before it wrote anything: no stall and no loop, just grok-4.6 reading its skills and reasoning
# for about four minutes, one stretch of it 169 seconds, and then being cut mid-thought. Plan 3's
# persona turn spent four of the same five minutes the same way. A cap that fails a real document
# turn is the pre-emptive restriction the founder ruled out — observe a looping run, never
# pre-restrict — so the caps become the ruling's numbers and stay observable.
# No tool address moves, so the conversation recipe stays at 28. The manual re-mints at
# `manual-*@v4` because the generated `limits` chapter renders BOTH of these numbers off this
# profile, and a catalog version is immutable: v56 keeps its v3 chapters.
# v56 (paged and spilled reads, 2026-09-14): v55's surface with the read side of the
# conversation finished. Two of the reads move to their PAGED contract — `read_account_research@2`
# and `read_discovery_run@2` take `offset`/`limit` and answer with `next_offset`, so a wide
# account or a long discovery is walked to the end instead of guessed at from one page — and two
# reads are GRANTED for the first time: `read_claims@1`, the general claims query (one account or
# contact, narrowed by field family, source tier, verification status or date, behind the same
# display gate the account page uses), and `read_artifact@1`, one artifact of this project's
# gallery by id, its summary or the words on its page. Nothing here spends, approves or launches;
# what they buy is that an answer about an account, a claim or an artifact rests on a row.
# The `@1`s of the two paged reads stay registered, and recipe0-stage0@27 stays the exact replay
# input for a turn pinned to it; they are simply no longer what this profile pins, so the
# name-only default alias moves with the pin.
# Skill pin v32→v33: §7c is rewritten as the read map — which read answers which question, that
# every read comes in pages and a `next_offset` is read to the end before a count is stated, that
# a narrowing `field_prefix` comes from `prefixes` and is never invented, and that a receipt
# carrying `spilled_to` is read from that file in chunks and noted in `scratch/notes.md`. The
# three document skills move to v2 with Task 7's free-flowing `project/` documents.
# The manual re-mints at v3 because the grant moved: the four generated chapters are rendered from
# THIS profile, and a catalog version is immutable, so v55 keeps its v2 chapters.
# Recipe revision 28 admits the four addresses and RE-PINS the two reads: a requirement set
# resolves one version per (kind, key), so the `@1`s leave the slot rather than stand beside
# their `@2`s — the move `open_icp_confirmation_gate@1` already made at revision 22.
# v55 (the versioned project root, 2026-09-14): v54 with the project's documents written as
# FILES instead of through three governed tools. `project/` joins `writable_prefixes`, so a
# `write_file` at `audience/icp-<key>.md`, `audience/persona-<key>.md` or `plan.md` lands a new
# version of the document that path names and the mount serves the refreshed file back on the
# same turn. `author_icp_document@1`, `request_persona_synthesis@1` and
# `write_project_document@1` are ungranted here for that reason: the act they performed is now a
# file write, and keeping them would offer two ways to write the same document. They stay
# registered and frozen for replay of executions pinned to recipe0-stage0@26 or earlier.
# The procedure moves with them. Stage-0 skill v31→v32 keeps §5b, §5c and §6b as one-line
# pointers and the three new skills carry the whole procedure: `icp-authoring@v1` (draft only
# from the brand's knowledge and this project's decisions, save at `project/audience/icp-<key>.md`,
# then open the gate), `persona-authoring@v1` (one section per `persona_map` role, for the pinned
# key only, written from the files because this surface has no web tool) and `plan-authoring@v1`
# (the plan, and what to do when a stale write comes back `revision_conflict`). None of the three
# grants a tool, so pinning them widens nothing.
# The manual re-mints at v2 because the grant moved: the four generated chapters are rendered
# from THIS profile, and four hand-written ones named the retired tools. Catalog versions are
# immutable and v54 still has to resolve, so the fifteen chapters are copied to v2 rather than
# edited in place. Recipe revision 27 drops the three addresses from the interaction slot.
# v54 (the operating manual, 2026-09-14): v53 with the manual disclosed. Fifteen `manual-*`
# chapters are pinned at v1 beside the Stage-0 skill, so the capability map names every one of
# them with a one-line summary and an openable path, and the agent reads the chapter instead of
# guessing: what one turn is and what ends it, what each folder and file in the workspace means,
# every governed tool with its refusals and the next move for each, the claim fields, how a claim
# is read, how account research and discovery actually run, how a document or a decision is
# written, which of its own rules the platform enforces and which it only states, what the human
# sees on each screen, the sibling agents, every error string, the turn's hard numbers, and the
# glossary. Four of the fifteen are generated from this exact profile by
# `python -m clue_api.manual_build --write`, so a chapter cannot quietly disagree with the grant.
# No tool is added or dropped and no address moves, so the conversation recipe stays at 26.
# Prompt pin moved v9→v10: the paragraph teaching specialist delegation is gone, because this
# surface withholds delegation, and the Stage-0 paragraph now points at the manual. Skill pin
# moved v30→v31: §1, §6, §7c and §10 name the chapter that answers the question the step
# raises, and §6 no longer claims the platform refuses an unrouted finalization, because on this
# surface nothing checks it.
# v53 (brand index path, 2026-09-14): v52 with the skill pin moved v29→v30 — §1 names the
# brand library's manifest at its real mounted path, `brand/index.json` (the tree root, beside
# `knowledge/`). Nothing else moves.
# v52 (the mounted libraries, 2026-09-13): v51 with the two read-only library mounts granted.
# The brand's knowledge is materialized once per pinned version and mounted at `brand/`, and the
# project's settled state — `status.md`, `decisions.md`, its own documents, the artifact index —
# is compiled once per project and mounted at `project/`, so both prefixes join the readable list.
# Neither is writable: a library is the platform's word about what is settled, and the agent
# changes it only through a governed tool (the plan through `write_project_document@1`), never by
# writing a file. Nothing is dropped — `inputs/` still carries this turn's message and cards, and
# the per-turn seeds beneath it are still readable while they exist. Prompt pin moved v8→v9 and
# skill pin v28→v29: both now name the mounted paths (`brand/knowledge/`, `project/`) instead of
# the seed paths, and §1 describes the project library as one place every thread of the project
# sees. No tool is added or dropped. Everything else is v51's.
# v51 (thread workspace, 2026-09-13): v50 with the workspace block moved to the thread layout.
# The workspace is now one persistent directory per chat thread, so `scratch/` — the agent's own
# notebook, which survives every turn of the thread — is granted readable and writable, and
# `reads/` is granted readable (the platform writes what a tool read back for it; the agent never
# writes there). `work/` stays on BOTH lists, readable and writable, so a delegated specialist's
# workspace is byte-for-byte what it was under v50 — the Head of ABM's own skill never names
# `work/` and never writes there, because `scratch/` is its notebook. (The registry intersects a
# child's workspace with its parent's on both lists, so dropping `work/` here would leave every
# delegated research/content/reviewer child writable only in `outputs/` — its own scratch pad
# taken away by a change to its parent. An unused `work/` costs the Head of ABM nothing.)
# `context/` stays readable, because the assembler still materializes the turn's context cards
# under it. Quota raised to 400 files / 20 MiB because the notebook
# persists across a long conversation instead of dying with the turn. Skill pin moved v27→v28
# (§1 names the notebook: what `scratch/` is for, and what belongs in the project's files instead).
# Nothing else moves.
# v50 (read-tool hotfix, 2026-09-13): v49 with the three reads' repaired contracts —
# `read_account_research` pages its claims (`offset`/`next_offset`), names the account's claim
# families (`prefixes`) and fits the governed receipt; `read_discovery_run` accepts the schema's
# own `pass` on input so its result passes the runner's validation. Skill pin moved v26→v27 (§7c:
# overviews render on first page view; read pages to the end; never invent a prefix; §1's
# onboarding pointer names the real flow). Nothing else moves. Digests read off the live
# descriptors.
# v49 (read-tool output schemas typed, 2026-09-13): v48 with the three reads' contracts repaired;
# skill pin moved v25→v26. The rows each read serves are now typed models in the output schema
# (`ProjectAccountView`, `AccountOverviewSection`, `AccountClaimView`, `DiscoveryCandidateView`)
# rather than opaque dicts, so a later change to a row shape moves the digest and this pin notices.
# Three contract repairs ride with them: `read_account_research`'s claims mirror the account
# page's own display gate (sensitive, unverified tier-4 and outreach-unsafe claims held back and
# counted in `excluded`, each claim carrying its verification status), so chat cannot state a fact
# the app refuses to print; `read_project_accounts` gains `query` and `offset`, so a named account
# past the first page is reachable; `read_discovery_run`'s `verified` counts the candidates the
# verifier judged rather than every candidate that is not pending. Nothing else moves: prompt v8,
# the gates, the ICP-authoring pair, the plan write, the ARV2 launches and run read, model,
# workspace, delegation and limits are v48's. Digests read off the live descriptors.
# v48 (read tools, 2026-09-13): v47 plus the three ARV2 read tools; skill pin moved v24→v25.
# `read_project_accounts@1`, `read_account_research@1` and `read_discovery_run@1` are effect-free
# reads over the project's own rows: the accounts in the project with each one's research status,
# what research found about one account (its written overview, or its live claims), and the latest
# discovery run with its candidates. They spend nothing, approve nothing and launch nothing — they
# are how this agent answers a question about accounts from the rows instead of from what its own
# thread happened to start. stage0-interview v25 §7c is the procedure (read before you speak) and
# its §7b says to read the last discovery run before proposing another. Nothing else moves: prompt
# v8, the gates, the ICP-authoring pair, the plan write, the ARV2 launches and run read, model,
# workspace, delegation and limits are v47's. Digests read off the live descriptors.
# v47 (project plan, 2026-09-12): v46 plus `write_project_document@1`; skill pin moved v23→v24.
# The agent may now write this project's one plan, `inputs/project/plan.md`, once the strategy is
# settled — the section-2 answers, a confirmed and pinned ICP, a confirmed product set. The write
# carries `expected_version`, so the human's own edits through the Plan tab are never overwritten
# silently: a stale version is refused by name and the agent re-reads and writes again.
# stage0-interview v24 §6b is the procedure (when the plan is written, what it contains, and the
# `project_document` domain ref that makes the plan card appear). Nothing else moves: prompt v8,
# the gates, the ICP-authoring pair, the ARV2 launches and run read, model, workspace, delegation
# and limits are v46's. Digests read off the live descriptor.
# v46 (ARV2 context and authoring, 2026-09-12): v45 plus `author_icp_document@1` and
# `request_persona_synthesis@1`; skill pin moved v22→v23. The agent may now write a proposed ICP
# document — brand-level or a project-local variant — and ask the platform to synthesize its
# personas. Neither tool confirms anything: authoring sets the status to proposed and the human
# still confirms through `open_icp_confirmation_gate@2`, and the persona request queues a
# background turn rather than producing a document on this one. stage0-interview v23 is the
# procedure (§5b authoring, §5c personas, §1 the project's own files). Nothing else moves:
# prompt v8, the gates, the ARV2 launches and run read, model, workspace, delegation and limits
# are v45's. Digests read off the live descriptors.
# v45 (ARV2 Track R, R4): v44 plus ONE tool — `launch_arv2_discovery@1`, verified account
# discovery for a project — and the skill version that teaches it, stage0-interview v22 (§7b,
# "Discover accounts for this project"). Nothing else moves: prompt v8, the product-set gate, the
# artifact-ref ICP gate and the ARV2 account/person launches and run read are v44's, and so are
# model, workspace, delegation and limits. Finding candidate accounts from the ICP the project
# pinned is the same act on the same lane as researching accounts a human named — it spends
# against providers, so it stays a governed launch the human's own turn must ask for, and a
# successful call means a run was queued, never that accounts were found or approved.
