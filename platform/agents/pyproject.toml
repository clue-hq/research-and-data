[project]
name = "clue-agents"
version = "0.0.0"
description = "Doc A — platform deepagent, subagents, skills loader, context assembly (build step 6) (scaffold — Doc R R2)."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "clue-core",
    "clue-obs",
    "deepagents==0.6.12",
    "langchain>=1.3,<2",
    "langchain-core>=1.5,<2",
    "pillow>=11.3,<12",
    "pillow-heif>=1,<2",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_agents"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-obs = { workspace = true }
