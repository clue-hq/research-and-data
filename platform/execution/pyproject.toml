[project]
name = "clue-execution"
version = "0.0.0"
description = "Durable run-graph and recipe contracts for the platform execution plane."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "clue-core",
    "clue-db",
    "clue-toolbelt",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_execution"]

[tool.hatch.build.targets.wheel.force-include]
"recipes" = "clue_execution/recipes"

[tool.uv.sources]
clue-core = { workspace = true }
clue-db = { workspace = true }
clue-toolbelt = { workspace = true }
