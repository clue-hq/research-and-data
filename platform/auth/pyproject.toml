[project]
name = "clue-auth"
version = "0.0.0"
description = "Clue-owned users, authentication mappings, workspace memberships, and request-principal substrate."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "clue-core",
    "clue-spine",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clue_auth"]

[tool.uv.sources]
clue-core = { workspace = true }
clue-spine = { workspace = true }
